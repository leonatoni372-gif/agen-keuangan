name: ci
on:
  push:
    branches: [master]
    paths-ignore: [laporan_log.json]
  pull_request:
    paths-ignore: [laporan_log.json]
jobs:
  aman-dan-bangun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # Gate: hanya critical yang menggagalkan. Diketahui & belum ada fix non-breaking:
      # - postcss HIGH (GHSA-6g55-p6wh-862q dkk, via next), fix = next 16 (major, ada PR dependabot #1)
      # - next MODERATE. Dependabot pantau mingguan; naikkan gate saat fix tersedia.
      - run: npm audit --audit-level=critical
      - name: Pastikan secret tak terlacak git
        run: |
          test ! -e .env.local
          ! git ls-files | grep -Eq '(^|/)\.env(\.|$)|(^|/)secrets?/'
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: ci
on:
  push:
    branches: [master]
  pull_request: {}
jobs:
  aman-dan-bangun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Pastikan secret tak terlacak git
        run: |
          test ! -e .env.local
          ! git ls-files | grep -Eq '(^|/)\.env(\.|$)|(^|/)secrets?/'
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
